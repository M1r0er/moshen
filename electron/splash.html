<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>墨参 MoShen</title>
<!--
  墨参 MoShen · 启动加载页
  ------------------------------------------------------------------
  依据《加载与等待动画需求文档》§7.2 与《加载动画设计规范文档》§7.1。
  由 Electron 主进程用 loadFile() 载入（不再是内联 data: URL，
  因为 data: 文档无法引用外部动画资源，见 §4.5 / §8.1）。

  内容：动画1「笔墨化剑」深色主题 240×240 + 标题 + 启动文案
  可操作元素：无。启动页保持完全无交互，不提供跳过按钮。
  素材路径说明：spark.html 与 frontend/ 同为打包内容，故用相对路径
  指到 frontend/assets/ink/，避免绿色版体积里出现两份动画素材。
-->
<style>
  html, body {
    margin: 0; height: 100%;
    background: #0f1117;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    cursor: default;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .splash { text-align: center; }
  .splash__anim { margin: 0 auto; }
  .splash__title {
    margin-top: 24px;
    font-size: 22px; font-weight: 600; letter-spacing: 2px;
    color: #7c5cfc;
    text-shadow: 0 0 24px rgba(124, 92, 252, 0.35);
  }
  .splash__hint {
    margin-top: 8px;
    font-size: 13px; color: #8b8fa3; letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="splash">
    <div class="splash__anim" id="splashAnim"></div>
    <div class="splash__title">墨参 MoShen</div>
    <div class="splash__hint">正在启动写作 Agent，请稍候...</div>
  </div>

  <script src="../frontend/assets/ink/ink-sword.js"></script>
  <script>
    /**
     * 启动页最短展示时长
     * ------------------------------------------------------------------
     * 后端就绪可能只需几百毫秒，若立刻切到主界面，品牌动画会被"掐断"在中途。
     * 这里由启动页对外提供「还要等多久」，主进程在跳转前询问它。
     *
     * 规则：等「当前这一轮」播完再进界面。因此
     *   · 加载比一轮快 → 等满一轮（不会看到半截动画）
     *   · 加载比一轮慢 → 等当前这轮收尾（不会在笔画中途被切走）
     * 两种情况都能看到从「落笔」到「消散」的完整一轮。
     */
    (function () {
      // 动画真正开始播放的时刻（0 表示没有在播，例如资源失败回退圆环）
      window.__splashAnimStart = 0;

      // 判定"已经停在轮次收尾"的容差：一轮 2.9s，30fps 下一帧约 33ms，
      // 留 150ms 避免因为几帧抖动而白等一整轮
      var BOUNDARY_TOLERANCE_MS = 150;

      // 还要等多少毫秒才能看到完整一轮；返回 0 表示可以立刻进入主界面
      window.__splashRemainingMs = function () {
        if (!window.__splashAnimStart) return 0;
        var dur = ((window.MoShenInkSword && window.MoShenInkSword.DURATION) || 2.9) * 1000;
        var elapsed = Date.now() - window.__splashAnimStart;
        var completed = Math.floor(elapsed / dur);
        var phase = elapsed - completed * dur;
        // 已经完整播完过至少一轮，且正卡在轮次边界上 → 不必再等
        if (completed >= 1 && phase < BOUNDARY_TOLERANCE_MS) return 0;
        return dur - phase;
      };

      var host = document.getElementById('splashAnim');
      if (!window.MoShenInkSword) {
        host.innerHTML = '<div style="width:240px;height:240px;display:flex;align-items:center;justify-content:center">' +
          '<i style="display:block;width:32px;height:32px;border:3px solid #2a2d3a;border-top-color:#7c5cfc;' +
          'border-radius:50%;animation:s .8s linear infinite"></i></div>';
        var st = document.createElement('style');
        st.textContent = '@keyframes s{to{transform:rotate(360deg)}}';
        document.head.appendChild(st);
        return;
      }
      window.MoShenInkSword.mount(host, {
        theme: 'dark',
        size: 240,
        base: '../frontend/assets/ink/',
        onStart: function () { window.__splashAnimStart = Date.now(); }
      });
    })();
  </script>
</body>
</html>
